# Main experiment config — DeepSeek-R1-Distill-Qwen-14B
# Stage 1: primary experiment model. Run after 7B config validates the pipeline.
#
# Hardware: RunPod RTX 4090 (24GB VRAM, ~$0.34/hr, estimated ~2-3hr = ~$1)
#   - 14B in 4-bit: ~9GB weights; +activations +optimizer ≈ 18-22GB total
#   - Fits on RTX 4090 with Unsloth gradient checkpointing
#   - Reduce per_device_train_batch_size to 1 if OOM; keep effective batch = 16
# Inference: Kaggle 2×T4 (32GB combined; 14B 4-bit ≈ 12-16GB — comfortable)
#            OR Modal A10G (24GB; see scripts/inference/modal_app.py)

# --- Model ---
base_model: unsloth/DeepSeek-R1-Distill-Qwen-14B
  # R1-Distill-Qwen-14B = DeepSeek-R1 reasoning distilled into Qwen2.5-14B architecture.
  # Same <think>…</think> format as 7B; better reasoning baseline and richer thinking blocks.

adapter_method: qlora

# --- Quantization ---
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

# --- LoRA adapter ---
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

modules_to_save:
  - embed_tokens
  - lm_head

# --- Optimizer & schedule ---
learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_ratio: 0.05

# --- Batch size ---
# Reduced per_device to 1 for VRAM headroom on RTX 4090; accumulation keeps effective=16.
per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # effective batch size = 16

# --- Sequence & packing ---
num_epochs: 3
max_seq_length: 2048
packing: true

# --- Reproducibility ---
seed: 42

# --- Data paths ---
training_corpus_path: data/augmented/full_canon_train.jsonl
heldout_corpus_path: data/processed/heldout/speckled_band.txt

# --- Output ---
output_dir: outputs/main_r1distill_qwen14b_seed42
run_name: main-r1distill-qwen14b-seed42

# --- Logging ---
logging_steps: 10
save_steps: 50
